services:
  - type: web
    name: srmap-stationery-backend
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: MONGODB_URI
        sync: false   # Set this in Render dashboard (your Atlas URL)
      - key: SESSION_SECRET
        sync: false   # Set in Render dashboard
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false   # Set in Render dashboard
      - key: RAZORPAY_KEY_ID
        sync: false   # Set in Render dashboard
      - key: RAZORPAY_KEY_SECRET
        sync: false   # Set in Render dashboard
      - key: FRONTEND_URL
        sync: false   # Set to your Vercel URL e.g. https://srmap-stationery.vercel.app
